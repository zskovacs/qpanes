[package]
name = "qpanes-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local filesystem domain for QPanes"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"

[target.'cfg(target_os = "linux")'.dependencies]
# Never enable the freedesktop copy/delete fallback.
trash = { version = "=5.3.0", default-features = false, features = ["portal"] }

[target.'cfg(target_os = "macos")'.dependencies]
trash = { version = "=5.3.0", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
