# Revisit versions with `mise` when you have settled on a release toolchain.
[tools]
rust = "stable"
node = "lts"
pnpm = "latest"

[tasks.dev]
description = "Run the Linux Tauri app under WSLg"
run = "pnpm tauri dev"

[tasks.ui-build]
description = "Build the Svelte frontend"
run = "pnpm build"

[tasks.ui-check]
description = "Check Svelte and TypeScript"
run = "pnpm check"

[tasks.ui-test]
description = "Test window state, DPI observations and platform configuration"
run = "node --test tests/window-state.test.mjs"

[tasks.rust-fmt]
description = "Verify Rust formatting"
run = ["cargo fmt --manifest-path crates/qpanes-core/Cargo.toml -- --check", "cargo fmt --manifest-path src-tauri/Cargo.toml -- --check"]

[tasks.rust-clippy]
description = "Verify Rust linting"
run = ["cargo clippy --manifest-path crates/qpanes-core/Cargo.toml --all-targets -- -D warnings", "cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings"]

[tasks.rust-test]
description = "Run Rust tests"
run = ["cargo test --manifest-path crates/qpanes-core/Cargo.toml", "cargo test --manifest-path src-tauri/Cargo.toml"]
